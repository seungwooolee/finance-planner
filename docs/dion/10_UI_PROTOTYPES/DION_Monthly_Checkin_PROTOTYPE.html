<script>

const fields=[['income','세후소득',300,'↙','이번 달 실제로 받은 돈'],['living','생활비',150,'⌂','식비·주거비·교통비·기타'],['debt','대출 원리금 상환',20,'↗','실제로 상환한 원금과 이자'],['goal','주거 목표 적립',20,'⌑','목표 통장에 새로 넣은 돈'],['existing','기존 투자 납입',40,'▥','기존에 이어온 투자 납입'],['newinvest','신규 투자 납입',30,'⌁','새 계획에 따라 납입한 돈'],['emergency','비상금 적립',20,'♧','비상금으로 새로 모은 돈'],['cash','추가 현금 저축',20,'▤','위 항목 외 추가 저축']];

const key='dion-monthly-prototype-v1';let db={},storageBroken=false;try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){storageBroken=true}let month='2026-11',view='record',failNext=false,noPlan=false;

function state(){return db[month]||(db[month]=fresh())}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2})}function monthLabel(){return month.replace('-','년 ')+'월'}function selected(v){return state().values[v]!==undefined&&state().values[v]!==''}function v(k){return selected(k)?Number(state().values[k]):0}function known(){return fields.filter(f=>selected(f[0])).length}function totals(){return{income:v('income'),cost:v('living')+v('debt'),transfer:['goal','existing','newinvest','emergency','cash'].reduce((a,k)=>a+v(k),0)}}function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3800)}function persist(){if(storageBroken)throw Error('unavailable');localStorage.setItem(key,JSON.stringify(db))}function go(t){view=t;noPlan=month<'2026-11';render();window.scrollTo(0,0)}function months(){return ['2026-11','2026-10','2026-09'].map(m=>`<option value="${m}" ${m===month?'selected':''}>${m.replace('-','년 ')}월</option>`).join('')}function changeMonth(m){month=m;noPlan=m<'2026-11';render()}function save(final=false){let s=state();if(final&&known()<8){toast('아직 입력하지 않은 금액이 있어요. 실행하지 않았다면 0을 입력해 주세요.');const missing=fields.find(f=>!selected(f[0]));document.getElementById('val-'+missing[0])?.focus();return}if(final&&s.mode!=='end'){toast('월말 마감으로 전환한 뒤 점검을 완료해 주세요.');return}if(final&&s.date!==month+'-'+new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()){toast('월말 마감에서는 월 전체 기간을 확인해 주세요.');return}if(failNext){failNext=false;showError();return}const oldSaved=s.saved,oldComplete=s.complete;s.saved=new Date().toISOString();s.complete=final;try{persist();if(final){view='complete';render();window.scrollTo(0,0)}else{document.getElementById('errorbox')?.classList.add('hidden');update();toast('이 브라우저에 임시 저장했어요.')}}catch(e){s.save function setValue(k,val){let s=state();s.values[k]=val;s.complete=false;if(k==='living'&&s.detailMode){s.detailMode=false;s.details={};document.getElementById('livingdetails')?.classList.remove('show')}update()}function mode(m){state().mode=m;if(m==='end')state().date=month+'-'+new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();else state().date=month+'-09';state().complete=false;render()}function details(){let s=state();if(!s.detailMode&&selected('living')){if(!confirm('상세 입력으로 전환하면 기존 생활비 합계 대신 상세 항목의 합계를 사용해요. 전환할까요?'))return}s.detailMode=!s.detailMode;if(s.detailMode){s.values.living='';s.details={}}render()}function detailVal(k,val){let s=state();s.details[k]=val;const entries=Object.values(s.details).filter(x=>x!=='');s.values.living=entries.length?entries.reduce((a,b)=>a+Number(b),0):'';document.getElementById('val-living').value=s.values.living;update()}
function taskChange(i,val){state().task[i]=val;state().complete=false;render()}function toggleChange(c){let s=state();if(c==='변화 없음'){s.changes=s.changes.includes(c)?[]:[c]}else{s.changes=s.changes.filter(x=>x!=='변화 없음');s.changes=s.changes.includes(c)?s.changes.filter(x=>x!==c):[...s.changes,c]}render()}function replan(){let s=state();if(!s.changes.length||s.changes.includes('변화 없음')){toast('먼저 달라진 점을 선택해 주세요.');return}toast('재검토 요청을 기록했어요. 계산 엔진 연결 후 새 초안을 비교할 수 있어요. 현재 계획은 유지돼요.')}
function render(){let s=state();document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById(view==='dashboard'?'navdash':view==='history'?'navhistory':'navrecord').classList.add('active');document.getElementById('app').innerHTML=view==='dashboard'?dashboard():view==='history'?history():view==='complete'?complete():record();if(view==='record')update()}
function screenHeader(title,desc,eyebrow='MONTHLY CHECK-IN'){return `<div class="crumb">내 재무현황 <span>›</span> <b>이번 달 기록·점검</b></div><div class="titlebar"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="month"><span class="tag">직접 입력</span><label><span class="sr">기록 대상 월</span><select onchange="changeMonth(this.value)">${months()}</select></label></div></div>`}
function record(){let s=state();return `${screenHeader('이번 달, 계획대로 보내고 있나요?','실제로 들어오고 나간 돈을 기록해 보세요.<br class="mobilelabel"> 아직 모르는 금액은 나중에 입력해도 괜찮아요.')}<div class="context"><span class="dot"></span>${noPlan?'<strong>비교할 계획을 선택해 주세요</strong><button class="smalllink" onclick="noPlan=false;render()">예시 채택 계획 연결</button>':'<strong>투자 여력 확대안 · B 균형운용</strong><span>v1.0 · 2026.11.05 적용</span>'}<span class="right">채택한 계획 기준 · 초안 제외</span></div><div class="grid"><div class="maincol"><section class="card"><div class="cardhead"><div><h2><span class="num">01</span>이번 달 돈의 흐름</h2><div class="subtitle">월 계획과 지금까지의 기록을 나란히 확인해요.</div></div><div class="seg"><button class="${s.mode==='mid'?'on':''}" onclick="mode('mid')">중간 기록</button><button class="${s.mode==='end'?'on':''}" onclick="mode('end')">월말 마감</button></div></div><div class="period"><span>집계 기간</span><span>${month.replace('-','.').slice(0,7)}.01 —</span><label><span class="sr">집계 기준일</span><input type="date" value="${s.date}" min="${month}-01" max="${month}-${new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()}" ${s.mode==='end'?'disabled':''} onchange="state().date=this.value;state().complete=false;update()"></label><span>단위: 만원</span></div><table class="ledger"><thead><tr><th>기록 항목</th><th>월 계획</th><th>실제 기록</th><th>계획과 차이</th></tr></thead><tbody>${fields.map((f,i)=>`${i===1?'<tr class="category"><td colspan="4">생활 지출 · 상환</td></tr>':i===3?'<tr class="category"><td colspan="4">목표 · 투자 · 저축으로 이동한 돈</td></tr>':''}<tr class="${i===0?'income':''}"><td><div class="rowlabel"><span class="tile">${f[3]}</span><div>${f[1]}<small>${f[4]}</small>${f[0]==='living'?`<button class="smalllink" onclick="details()">${s.detailMode?'합계로 입력하기':'＋ 상세 입력'}</button>`:''}</div></div></td><td><span class="mobilelabel">월 계획</span>${noPlan?'—':fmt(f[2])+'만원'}</td><td><label class="money"><span class="sr">${f[1]} 실제 금액</span><input id="val-${f[0]}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="미입력" value="${esc(s.values[f[0]]??'')}" ${f[0]==='living'&&s.detailMode?'readonly':''} oninput="if(this.validity.valid)setValue('${f[0]}',this.value)"><span>만원</span></label></td><td class="diff" id="diff-${f[0]}">미입력</td></tr>`).join('')}</tbody></table><div id="livingdetails" class="details ${s.detailMode?'show':''}"><h3>생활비 상세 입력</h3><div class="detailgrid">${['식비','주거비','교통비','기타'].map(k=>`<label>${k} · 만원<input type="number" min="0" step="0.01" inputmode="decimal" value="${esc(s.details[k]??'')}" placeholder="미입력" oninput="if(this.validity.valid)detailVal('${k}',this.value)"></label>`).join('')}</div><p style="font-size:10px">상세 항목 합계를 생활비로 사용해요. 합계와 중복 집계하지 않아요.</p></div><div class="hint">ⓘ &nbsp;빈칸은 ‘아직 모름’, 0은 ‘실행하지 않음’이에요.<br>투자·저축은 자산 간 이동이며, 투자 납입액은 수익이나 손실이 아니에요.</div><div id="over" class="hidden alert" role="status"></div><details class="disclosure"><summary>일시금 실행 기록 <span style="font-size:10px;color:#aaa1b8">월 배분과 별도</span></summary><p style="font-size:11px">이번 달 처음 옮긴 금액만 기록해요. 이미 분리해 둔 돈을 다시 더하지 않아요.</p><div class="detailgrid">${[['invest','신규 일시 투자'],['housing','주거자금 분리']].map(([k,l])=>`<label>${l} · 만원 (계획 400)<input type="number" inputmode="decimal" min="0" step="0.01" placeholder="미입력" value="${esc(s.lumps[k]??'')}" oninput="if(this.validity.valid){state().lumps['${k}']=this.value;state().complete=false}"></label>`).join('')}</div></details></section><section class="card"><div class="cardhead"><div><h2><span class="num">02</span>이번 달 할 일</h2><div class="subtitle">준비한 일과 실제 돈을 넣은 기록은 따로 관리해요.</div></div><span class="progress" id="taskprogress"></span></div>${tasks.map((t,i)=>`<div class="task ${s.task[i]==='done'?'done':''}"><span class="circle">${s.task[i]==='done'?'✓':''}</span><div class="tasktext"><b>${t}</b><p>${['등록 여부를 확인해요. 실제 적립액은 위에 기록해 주세요.','지킬 수 있는 생활비 예산인지 확인해요.','잔액 확인은 실제 상환 완료와 달라요.','설정 여부와 실제 납입액을 구분해요.'][i]}</p>${s.task[i]==='hold'?`<input aria-label="${t} 보류 이유" placeholder="보류한 이유를 적어 주세요 (선택)" value="${esc(s.reasons[i]??'')}" oninput="state().reasons[${i}]=this.value">`:''}</div><label><span class="sr">${t} 상태</span><select onchange="taskChange(${i},this.value)">${[['planned','예정'],['progress','진행 중'],['done','완료'],['hold','보류']].map(([v,l])=>`<option value="${v}" ${s.task[i]===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`).join('')}</section><section class="card"><h2><span class="num">03</span>최근 달라진 점이 있나요?</h2><p class="subtitle">상황이 바뀌었다면, 계획도 함께 살펴봐요.</p><details class="disclosure" ${s.changes.length?'open':''}><summary>달라진 점 선택하기</summary><div class="chips">${['소득 변화','예상하지 못한 지출','부채 변화','목표 금액·시기 변화','투자에 대한 생각 변화','변화 없음'].map(c=>`<button class="${s.changes.includes(c)?'on':''}" aria-pressed="${s.changes.includes(c)}" onclick="toggleChange('${c}')">${c}</button>`).join('')}</div>${s.changes.some(c=>c!=='변화 없음')?`<label class="sr" for="changenote">변경 내용</label><textarea id="changenote" class="textarea" rows="3" placeholder="어떤 점이 달라졌나요? 선택한 변화의 금액·시기 등을 적어 주세요." oninput="state().note=this.value">${esc(s.note)}</textarea><button class="btn soft" onclick="replan()">변경 사항으로 계획 다시 검토하기 ↗</button><p style="font-size:10px">새 초안으로 검토해요. 지금 채택한 계획은 바뀌지 않아요.</p>`:''}</details></section><div id="errorbox" class="errorbox hidden" role="alert" tabindex="-1">저장하지 못했어요. 입력한 내용은 화면에 남아 있어요.<button class="btn" onclick="save(false)">다시 저장</button></div><div class="footerbar"><span class="saveinfo" id="savedinfo"></span><button class="btn" onclick="save(false)">임시 저장</button><button class="btn primary" onclick="save(true)">이번 달 점검 완료 &nbsp; →</button></div><div class="footnote">이 디자인 시제품의 기록은 현재 브라우저에만 저장돼요. 기기 간 동기화는 제공하지 않아요.</div><div class="devtools" aria-label="디자인 상태 미리보기"><button onclick="sample()">중간 기록 예시</button><button onclick="overSample()">소득 초과 예시</button><button onclick="failNext=true;save(false)">저장 실패 예시</button><button onclick="noPlan=!noPlan;render()">채택 계획 없음</button><button onclick="resetRecord()">빈 기록 보기</button></div></div><aside class="side"><section class="card summary"><div class="cardhead" style="margin-bottom:15px"><h2>지금까지의 기록</h2><span class="tag" id="partial">일부 입력 기준</span></div><div style="font-size:11px;color:#9185a7" id="balanceLabel">아직 배정하지 않은 금액</div><div class="big" id="balance">—<span class="unit">만원</span></div><div class="bar" id="allocation"></div><div class="rule"></div><div class="sumrow"><span>실제 소득</span><b id="sum-income">—</b></div><div class="sumrow"><span>생활비 · 대출 상환</span><b id="sum-cost">—</b></div><div class="sumrow"><span>목표 · 투자 · 저축</span><b id="sum-transfer">—</b></div><div class="rule"></div><div class="sumrow"><span>금액 입력</span><b id="entered">0 / 8개</b></div><div class="sidefoot" id="summarynote">입력한 금액만 합산해요.<br>월 전체 계획 대비 현재 기록액이에요.</div></section><div class="coach"><div class="coachhead"><div class="cat">🐈‍⬛</div><div><h3>냥코치의 한마디</h3><small>이번 달도, 내 속도대로</small></div></div><p id="coachtext">한 번에 다 입력하지 않아도 괜찮아요. 알고 있는 금액부터 남겨볼까요?</p></div><p style="font-size:10px;padding:0 9px;color:#aaa1b8">✦ &nbsp;계획은 기준이고, 기록은 다음 선택의 힌트예요.</p></aside></div>`}
function update(){if(view!=='record')return;let s=state(),t=totals(),n=known(),balance=t.income-t.cost-t.transfer;for(let f of fields){let el=document.getElementById('diff-'+f[0]);el.textContent=!selected(f[0])?'미입력':noPlan?'비교 전':(v(f[0])-f[2]>0?'+':'')+fmt(v(f[0])-f[2])+'만';el.style.color='#9691ae'}document.getElementById('partial').textContent=n===8?'전체 입력':'일부 입력 기준';document.getElementById('entered').textContent=n+' / 8개';document.getElementById('balanceLabel').textContent=selected('income')?(balance<0?'소득을 초과해 사용한 금액':'아직 배정하지 않은 금액'):'소득을 입력하면 잔액이 보여요';document.getElementById('balance').innerHTML=(selected('income')?fmt(Math.abs(balance)):'—')+'<span class="unit">만원</span>';document.getElementById('sum-income').textContent=selected('income')?fmt(t.income)+'만원':'미입력';document.getElementById('sum-cost').textContent=['living','debt'].some(selected)?fmt(t.cost)+'만원':'미입력';document.getElementById('sum-transfer').textContent=['goal','existing','newinvest','emergency','cash'].some(selected)?fmt(t.transfer)+'만원':'미입력';let denominator=Math.max(t.income,t.cost+t.transfer,1);document.getElementById('allocation').innerHTML=`<i style="background:#a899db;width:${t.cost/denominator*100}%"></i><i style="background:#6554c2;width:${t.transfer/denominator*100}%"></i>`;let done=s.task.filter(x=>x==='done').length;document.getElementById('taskprogress').innerHTML=`<b>${done} / 4건</b> · ${done*25}%`;document.getElementById('savedinfo').textContent=lastSaved();document.getElementById('coachtext').textContent=n===0?'한 번에 다 입력하지 않아도 괜찮아요. 알고 있는 금액부터 남겨볼까요?':`8개 항목 중 ${n}개를 기록했어요. ${s.mode==='mid'?'아직 중간 기록이니 월말에 한 번 더 확인해요.':'계획과 다른 부분은 이유를 함께 남겨두면 좋아요.'}`;let over=document.getElementById('over');over.classList.toggle('hidden',!selected('income')||balance>=0);over.innerHTML=`이번 달 소득보다 기록한 금액이 많아요. 기존 잔액을 사용했거나 빠진 수입이 있는지 확인해 주세요.<br><button onclick="state().funding='기존 잔액 사용';toast('기존 잔액 사용으로 메모했어요. 월소득에는 더하지 않아요.')">기존 잔액 사용${s.funding?' ✓':''}</button><button onclick="document.getElementById('val-income').focus()">추가 수입</button><button onclick="document.getElementById('val-living').focus()">입력 수정</button>`}
function dashboard(){let s=state();return `${screenHeader('반가워요, 김디오님.','지난 계획을 확인하고, 이번 달의 기록을 이어가세요.','MY FINANCIAL HOME')}<div class="returnhero"><div><span class="tag">${s.complete?'월말 점검 완료':known()?'기록 작성 중':'아직 기록이 없어요'}</span><h2 style="margin-top:15px">${monthLabel()}의 기록을 남겨볼까요?</h2><p>마지막 저장: ${lastSaved()}</p></div><button class="btn primary" onclick="go('record')">${known()?'기록 이어하기':'이번 달 기록하기'} &nbsp; →</button></div><div class="dashgrid"><section class="card"><span class="tag">채택한 계획</span><h2 style="margin-top:18px">투자 여력 확대안 · B 균형운용</h2><p class="subtitle">v1.0 · 2026.11.05 적용 · 주식 40 / 채권 40 / 현금 20</p>${fields.map(f=>`<div class="dashlist"><span>${f[1]}</span><b>${fmt(f[2])}만원</b></div>`).join('')}<p style="font-size:10px">월 배분 합계 300만원 · 신규 일시금 400만원은 별도</p></section><div><section class="card"><span class="tag">검토 중인 초안</span><h2 style="margin-top:18px">직접 조정안 · 45:35:20</h2><p>채택 전 초안은 이번 달 실적 비교에 반영하지 않아요.</p></section><section class="card"><h2>다음 점검</h2><p style="font-size:22px;color:#63538d;margin-top:16px">${monthLabel()} 말</p><p>이번 달 기록과 계획의 차이를 확인해요.</p><button class="btn soft" onclick="go('record')">지금 미리 지출 기록하기 →</button></section></div></div>`}
function history(){return `${screenHeader('차곡차곡 쌓인 나의 기록','지난 기록을 열어 수정하거나, 이번 달의 흐름을 살펴보세요.','CHECK-IN HISTORY')}<div style="margin-top:28px">${['2026-11','2026-10','2026-09'].map(m=>{let s=db[m];return `<section class="card"><div class="cardhead"><div><h2>${m.replace('-','년 ')}월</h2><p class="subtitle">${s?.saved?'마지막 저장 '+new Date(s.saved).toLocaleString('ko-KR'):'저장한 기록이 없어요.'}</p></div><span class="tag">${s?.complete?'월말 마감':s?.saved?'중간 기록':'미기록'}</span></div><button class="btn soft" onclick="month='${m}';go('record')">${s?.saved?'기록 다시 보기':'기록 시작하기'} →</button></section>`}).join('')}</div>`}
function complete(){let s=state(),t=totals();return `<section class="card complete"><div class="completebadge">✓</div><div class="eyebrow" style="text-align:center">MONTHLY REVIEW</div><h1>이번 달의 기록을 남겼어요.</h1><p>완벽한 실천보다, 내 흐름을 알아가는 한 걸음.</p><div style="margin-top:26px">${[['기록 대상',monthLabel()],['집계 기간',month+'.01 ~ '+s.date],['입력 완료','8 / 8개'],['실제 소득',fmt(t.income)+'만원'],['생활비 · 대출 상환',fmt(t.cost)+'만원'],['목표 · 투자 · 저축',fmt(t.transfer)+'만원'],['미배정 / 초과 사용',fmt(t.income-t.cost-t.transfer)+'만원'],['다음 점검','다음 달 말'],['비교한 계획',noPlan?'채택 계획 없음':'B 균형운용 · v1.0']].map(([k,v])=>`<div class="reviewrow"><span style="color:#93879e">${k}</span><b>${v}</b></div>`).join('')}</div><p style="font-size:10px;margin:22px 0">현재 브라우저에 저장했어요. 계획과 계좌는 자동 변경되지 않아요.</p><div style="display:flex;justify-content:center;gap:10px"><button class="btn" onclick="go('record')">수정하기</button><button class="btn primary" onclick="go('dashboard')">대시보드로 돌아가기</button></div></section>`}
function sample(){let s=state();s.values={income:300,living:73.5,debt:0,goal:20,existing:40};s.task=['done','done','done','progress'];s.mode='mid';s.complete=false;render();toast('디자인 확인용 예시를 불러왔어요. 저장 전에는 기록에 반영되지 않아요.')}function overSample(){let s=state();s.values={income:240,living:150,debt:20,goal:20,existing:40,newinvest:30,emergency:20,cash:20};s.complete=false;render()}function resetRecord(){if(!confirm('이 달의 화면 입력을 비울까요? 저장하면 기존 기록을 덮어써요.'))return;db[month]=fresh();render()}
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(['dashboard','record','history'].includes(h))go(h)});if(['dashboard','record','history'].includes(location.hash.slice(1)))view=location.hash.slice(1);render();
</script></body></html>
