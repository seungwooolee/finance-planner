name: Core checks

# Same scope as scripts/verify.ps1 -Mode Core (pytest, Ruff, pip check, TypeScript, ESLint).
# No deploy, no secrets, no external API calls. Browser E2E and production build are not run here.
# Triggers follow AGENTS.md: no full check on every dev push; run on PRs, the integration
# branch, or manually (Actions tab > Run workflow).
on:
  push:
    branches: ["dion/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-be.txt
      - run: python -m pytest -q
      - run: python -m ruff check app tests
      - run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
